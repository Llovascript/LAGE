<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LAGE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header Section -->
    <header class="main-header">
        <div class="header-content">
            <span class="header-text">LAGE</span>
        </div>
    </header>

    <!-- Content Section (heredado por las páginas) -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
